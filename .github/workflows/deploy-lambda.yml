name: Deploy Lambda

on:
  workflow_call:
    inputs:
      s3_key:
        description: "Key of the package in package_bucket, from build-lambda.yml."
        required: true
        type: string
      fingerprint:
        description: "SHA-256 the package must have, from build-lambda.yml."
        required: true
        type: string
      function_name:
        required: true
        type: string
      environments:
        description: "Account types to deploy to, as terraform-deploy-matrix selects them, e.g. '\"staging\"' or '\"production\"'."
        required: true
        type: string
      github_environment:
        description: "GitHub environment whose protection rules, such as a required reviewer, must pass before any account is deployed to. Empty deploys without one."
        default: ""
        type: string
      role_name:
        description: "IAM role assumed in each account. It needs lambda:UpdateFunctionCode and lambda:GetFunction on the function, and s3:GetObject on package_bucket. Defaults to the caller's repository name."
        default: ${{ github.event.repository.name }}
        type: string
      package_bucket:
        default: "lambda-packages-dacef8339fbd41ce31c346f854a85d0c74f7c4e8"
        type: string
      kosli_flow:
        description: "Kosli flow of the package, from build-lambda.yml. With kosli_trail and the kosli_api_token secret, the plan names the commit each account runs."
        default: ""
        type: string
      kosli_trail:
        description: "Kosli trail of the package, from build-lambda.yml: the commit it was built from."
        default: ""
        type: string
      kosli_host:
        default: "https://app.kosli.com"
        type: string
      kosli_org:
        default: "kosli"
        type: string
      kosli_cli_version:
        default: "latest"
        type: string
    secrets:
      kosli_api_token:
        description: "Reads the flow, to find the commit of the code each account runs. Without it the plan shows fingerprints only."
        required: false

jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      json: ${{ steps.matrix.outputs.json }}
    steps:
      - id: matrix
        uses: kosli-dev/terraform-deploy-matrix@main
        with:
          environments: ${{ inputs.environments }}

  # What each account runs and what it will run, in the job summary, so a
  # reviewer of the deploy sees it before approving.
  plan:
    name: Plan for ${{ matrix.name }}
    needs: accounts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.accounts.outputs.json) }}
    env:
      FUNCTION_NAME: ${{ inputs.function_name }}
      FINGERPRINT: ${{ inputs.fingerprint }}
      ACCOUNT: ${{ matrix.name }}
      REGION: ${{ matrix.aws_region }}
      KOSLI_ORG: ${{ inputs.kosli_org }}
      KOSLI_HOST: ${{ inputs.kosli_host }}
      KOSLI_API_TOKEN: ${{ secrets.kosli_api_token }}
      KOSLI_FLOW: ${{ inputs.kosli_flow }}
      NEW_COMMIT: ${{ inputs.kosli_trail }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ matrix.aws_account_id }}:role/${{ inputs.role_name }}
          aws-region: ${{ matrix.aws_region }}
          role-session-name: ${{ inputs.role_name }}
          action-timeout-s: 45
          retry-max-attempts: 3

      - uses: kosli-dev/setup-cli-action@060e7f9bf6ac246743d6a62c5df847dfe7050867 # v5.2.1
        if: env.KOSLI_API_TOKEN != '' && env.KOSLI_FLOW != ''
        with:
          version: ${{ inputs.kosli_cli_version }}

      # Lambda reports the code's SHA-256 in base64; Kosli fingerprints in hex.
      - name: Compare the running code with the package
        run: |
          set -euo pipefail
          running=$(aws lambda get-function --function-name "$FUNCTION_NAME" \
            --query Configuration.CodeSha256 --output text | base64 -d | od -An -tx1 | tr -d ' \n')

          old_commit=""
          if [ -n "$KOSLI_API_TOKEN" ] && [ -n "$KOSLI_FLOW" ]; then
            old_commit=$(kosli get artifact "$KOSLI_FLOW@$running" --output json 2>/dev/null \
              | jq -r '[.. | objects | .git_commit? | strings][0] // empty' || true)
          fi

          short() { printf '`%s`' "${1:0:12}"; }
          trail_url="$KOSLI_HOST/$KOSLI_ORG/flows/$KOSLI_FLOW/trails/$NEW_COMMIT"
          {
            echo "### $FUNCTION_NAME in $ACCOUNT ($REGION)"
            echo
            echo "| | Fingerprint | Commit |"
            echo "|---|---|---|"
            echo "| Running | $(short "$running") | ${old_commit:+$(short "$old_commit")} |"
            echo "| Will deploy | $(short "$FINGERPRINT") | ${NEW_COMMIT:+$(short "$NEW_COMMIT")} |"
            echo
            if [ "$running" = "$FINGERPRINT" ]; then
              echo "**No change:** the account already runs this package."
            elif [ -n "$old_commit" ] && [ -n "$NEW_COMMIT" ]; then
              echo "**Change:** [${old_commit:0:12}...${NEW_COMMIT:0:12}]($REPOSITORY_URL/compare/$old_commit...$NEW_COMMIT)"
            elif [ -n "$KOSLI_API_TOKEN" ] && [ -n "$KOSLI_FLOW" ]; then
              echo "**Change:** the running code is not an artifact of \`$KOSLI_FLOW\`, so it has no build trail."
            else
              echo "**Change:** the code changes; without a Kosli flow and token the running code's commit is unknown."
            fi
            if [ -n "$KOSLI_FLOW" ] && [ -n "$NEW_COMMIT" ]; then
              echo
              echo "Build trail, with its control decisions: $trail_url"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # With github_environment set, the deploys wait on its protection rules, and
  # one approval releases every account's deploy.
  deploy:
    name: Deploy to ${{ matrix.name }}
    needs: [accounts, plan]
    environment: ${{ inputs.github_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    strategy:
      # Each account is deployed on its own, and one failing says nothing about
      # the rest.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.accounts.outputs.json) }}
    env:
      FUNCTION_NAME: ${{ inputs.function_name }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ matrix.aws_account_id }}:role/${{ inputs.role_name }}
          aws-region: ${{ matrix.aws_region }}
          role-session-name: ${{ inputs.role_name }}
          action-timeout-s: 45
          retry-max-attempts: 3

      # The package is passed to Lambda as bytes, so Lambda never reads the
      # bucket, which is in eu-central-1 whatever region the function is in.
      - name: Download and check the package
        env:
          BUCKET: ${{ inputs.package_bucket }}
          KEY: ${{ inputs.s3_key }}
          FINGERPRINT: ${{ inputs.fingerprint }}
        run: |
          aws s3 cp --region eu-central-1 "s3://$BUCKET/$KEY" package.zip
          actual=$(sha256sum package.zip | cut -d' ' -f1)
          [ "$actual" = "$FINGERPRINT" ] \
            || { echo "::error::s3://$BUCKET/$KEY is $actual, expected $FINGERPRINT"; exit 1; }

      - name: Swap the function's code
        run: aws lambda update-function-code
          --function-name "$FUNCTION_NAME"
          --zip-file fileb://package.zip
          --publish
          --no-cli-pager

      - name: Wait for the function to become active
        run: aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
