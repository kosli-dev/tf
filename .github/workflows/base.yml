name: Terraform

on:
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string
      aws_role_arn:
        required: true
        type: string
      aws_role_duration:
        default: "1200"
        type: string
      working_directory:
        default: "./"
        type: string
      tf_version:
        default: "1.17.1"
        type: string
      tf_apply:
        default: false
        type: boolean
      checkov:
        description: "When true, scan the plan JSON with Checkov after the plan, upload the report, attest it to Kosli (when kosli_template_file is set) and, unless checkov_soft_fail is true, fail the job on any finding. See the README on Checkov scanning."
        default: false
        type: boolean
      checkov_soft_fail:
        description: "When true, Checkov findings are reported in the job summary and attested to Kosli but do not fail the job. Set false to make findings block the plan or apply."
        default: true
        type: boolean
      checkov_version:
        description: "Version of Checkov to install."
        default: "3.4.3"
        type: string
      role_session_prefix:
        description: "Prefix for the AWS role session name, which CloudTrail records on every event the session makes. Defaults to apply or plan, from tf_apply. detect-drift passes detect-drift so its plans can be told apart from a PR plan of the same commit."
        default: ""
        type: string
      job_timeout_minutes:
        description: "Minutes before GitHub cancels the plan/apply job. The default follows aws_role_duration: the OIDC credentials are static environment variables that are never refreshed, so AWS calls start failing with ExpiredToken 1200s (20 min) after the credentials step and a longer ceiling would buy nothing. Raise both together if a legitimate apply needs longer."
        default: 30
        type: number
      environment:
        required: true
        type: string
      ref:
        default: ""
        type: string
      github_repository_to_checkout:
        description: "GitHub repository (owner/name) to check out. Defaults to the repository that initiated the run. Override when a workflow in one repository needs to operate on a different repository's Terraform code."
        default: ${{ github.repository }}
        type: string
      tf_vars:
        description: "Extra environment variables, one KEY=VALUE per line, exported before plan/apply. To set Terraform variable `foo`, use `TF_VAR_foo=...`. Single-line values only."
        default: ""
        type: string
      component_name:
        description: "Name of the thing being deployed, used for the statefile path terraform/<name>/. Empty uses the checked-out repository's name. Set it when one repository deploys several components, each with its own state."
        default: ""
        type: string
      kosli_template_file:
        description: "Path (in caller repo) to the Kosli trail template. Empty disables all Kosli steps."
        default: ""
        type: string
      kosli_host:
        default: "https://app.kosli.com"
        type: string
      kosli_org:
        default: "kosli"
        type: string
      kosli_flow:
        description: "Kosli flow name. Required when kosli_template_file is set."
        default: ""
        type: string
      kosli_cli_version:
        default: "latest"
        type: string
      pass_commit_to_kosli_commands:
        description: "When true, pass `--commit <ref>` to the Kosli commands via the COMMIT_ARG environment variable."
        default: false
        type: boolean
    secrets:
      kosli_api_token:
        description: "Kosli API token. Required when kosli_template_file is set."
        required: false
    outputs:
      has_changes:
        description: "true if the plan contains changes, false if no changes"
        value: ${{ jobs.terraform.outputs.has_changes }}
      kosli_flow:
        description: "The Kosli flow name used for attestations."
        value: ${{ jobs.terraform.outputs.kosli_flow }}
      kosli_trail:
        description: "The Kosli trail name used for attestations."
        value: ${{ jobs.terraform.outputs.kosli_trail }}
      commit_sha:
        description: "The commit the job checked out and ran Terraform against. On a pull_request event this is the PR head commit, not the synthetic merge commit."
        value: ${{ jobs.terraform.outputs.commit_sha }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    env:
      AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
      environment: ${{ inputs.environment }}
      KOSLI_ORG: ${{ inputs.kosli_org }}
      KOSLI_HOST: ${{ inputs.kosli_host }}
      KOSLI_API_TOKEN: ${{ secrets.kosli_api_token }}
      KOSLI_FLOW: ${{ inputs.kosli_flow }}
      KOSLI_TRAIL: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      COMMIT_ARG: ${{ inputs.pass_commit_to_kosli_commands && format('--commit {0}', inputs.ref) || '' }}
    permissions:
      id-token: write
      contents: write
    outputs:
      has_changes: ${{ steps.plan-summary.outputs.has_changes }}
      kosli_flow: ${{ steps.kosli-outputs.outputs.kosli_flow }}
      kosli_trail: ${{ steps.kosli-outputs.outputs.kosli_trail }}
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.github_repository_to_checkout }}
          ref: ${{ inputs.ref }}

      - name: Resolve the commit for the AWS role session name
        id: commit
        # On a pull_request event the checkout is the synthetic merge commit,
        # which does not outlive the PR, so record the PR head commit instead.
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$SHA" ]; then
            SHA=$(git rev-parse HEAD)
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Export Kosli outputs
        id: kosli-outputs
        run: |
          {
            echo "kosli_flow=$KOSLI_FLOW"
            echo "kosli_trail=$KOSLI_TRAIL"
          } >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ inputs.tf_version }}
          terraform_wrapper: false

      - name: Install tf
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kosli-dev/tf
          path: .tf-cli
      - run: echo "$GITHUB_WORKSPACE/.tf-cli/bin" >> "$GITHUB_PATH"

      - name: Install uv
        # Callers that package a python Lambda build it with `uv export` and
        # `uv pip install`, run by terraform-aws-modules/lambda/aws during apply.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Check formatting
        working-directory: ${{ inputs.working_directory }}
        run: terraform fmt --recursive -check

      - name: Configure AWS credentials
        timeout-minutes: 2
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-duration-seconds: ${{ inputs.aws_role_duration }}
          # CloudTrail stamps the session name on every event the session
          # makes, so it says what kind of run this is and which commit it ran.
          role-session-name: ${{ inputs.role_session_prefix || (inputs.tf_apply && 'apply' || 'plan') }}-${{ steps.commit.outputs.sha }}
          action-timeout-s: 45
          retry-max-attempts: 3

      - name: Setup Kosli CLI
        if: inputs.kosli_template_file != ''
        uses: kosli-dev/setup-cli-action@060e7f9bf6ac246743d6a62c5df847dfe7050867 # v5.2.1
        with:
          version: ${{ inputs.kosli_cli_version }}

      # Exported only when set, so an unset input leaves TF_COMPONENT_NAME
      # free to come from the repo's tf.env, as it does when tf runs locally.
      - name: Export component name
        if: inputs.component_name != ''
        env:
          COMPONENT_NAME: ${{ inputs.component_name }}
        run: printf 'TF_COMPONENT_NAME=%s\n' "$COMPONENT_NAME" >> "$GITHUB_ENV"

      - name: Export Terraform variables
        if: inputs.tf_vars != ''
        env:
          TF_VARS: ${{ inputs.tf_vars }}
        run: printf '%s\n' "$TF_VARS" >> "$GITHUB_ENV"

      - name: Plan
        working-directory: ${{ inputs.working_directory }}
        run: tf plan -no-color

      - name: Show plan
        working-directory: ${{ inputs.working_directory }}
        run: tf show -no-color /tmp/${{ inputs.environment }}.tfplan > /tmp/${{ inputs.environment }}.plan.txt

      - name: Plan summary
        id: plan-summary
        run: |
          # A plan that changes only outputs has neither a "Plan:" line nor
          # "No changes.", so fall back to the outputs header and then to a
          # generic message rather than letting grep fail the step.
          plan=/tmp/${{ inputs.environment }}.plan.txt
          line=$(grep -E 'No changes\.|Plan: ' "$plan" || true)
          if [ -z "$line" ]; then
            line=$(grep -E 'Changes to Outputs:' "$plan" || true)
          fi
          if [ -z "$line" ]; then
            line="See the uploaded plan for details."
          fi
          {
            echo "### ${{ inputs.environment }}"
            echo "$line"
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'No changes\.' "$plan"; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload plan
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tfplan-${{ inputs.environment }}
          path: /tmp/${{ inputs.environment }}.plan.txt
          archive: false

      # Checkov scans the plan JSON rather than the HCL: the plan has tfvars,
      # variables and module inputs resolved, so each environment is scanned
      # as it will actually be built. A plan with no changes still lists every
      # planned resource, so the whole stack is scanned on every run.
      - name: Checkov scan
        if: inputs.checkov
        working-directory: ${{ inputs.working_directory }}
        env:
          CHECKOV_VERSION: ${{ inputs.checkov_version }}
          PLAN_JSON: /tmp/${{ inputs.environment }}.plan.json
          REPORT_DIR: /tmp/checkov-${{ inputs.environment }}
          REPORT_TXT: /tmp/${{ inputs.environment }}.checkov.txt
          REPORT_JSON: /tmp/${{ inputs.environment }}.checkov.json
        run: |
          tf show -json /tmp/${{ inputs.environment }}.tfplan > "$PLAN_JSON"
          # Always --soft-fail here so the report is produced and attested
          # whatever it says; the "Checkov gate" step decides whether the job
          # fails. --quiet --compact keep the JSON, which Kosli caps at 1MB, to
          # the failed checks without code blocks; the summary still counts
          # every check, and the full text report is attached alongside it.
          # Checkov reads .checkov.yaml from the working directory, and the
          # enrichment maps each finding back to its HCL file and lines.
          uvx --from "checkov==${CHECKOV_VERSION}" checkov \
            --file "$PLAN_JSON" \
            --framework terraform_plan \
            --repo-root-for-plan-enrichment . \
            --quiet --compact --soft-fail \
            --output cli --output json \
            --output-file-path "$REPORT_DIR"
          # Checkov names its reports results_cli.txt and results_json.json.
          # Rename them to match the plan files, so each is uploaded as its own
          # artifact with a unique name across the environment matrix.
          mv "$REPORT_DIR/results_cli.txt" "$REPORT_TXT"
          mv "$REPORT_DIR/results_json.json" "$REPORT_JSON"

      - name: Checkov summary
        if: inputs.checkov
        id: checkov-summary
        env:
          REPORT_TXT: /tmp/${{ inputs.environment }}.checkov.txt
          REPORT_JSON: /tmp/${{ inputs.environment }}.checkov.json
        run: |
          # A scan that finds no resources emits only the summary counters at
          # the top level, with no .summary key, so fall back to the top level.
          passed=$(jq '(.summary // .) | .passed' "$REPORT_JSON")
          failed=$(jq '(.summary // .) | .failed' "$REPORT_JSON")
          skipped=$(jq '(.summary // .) | .skipped' "$REPORT_JSON")
          parsing_errors=$(jq '(.summary // .) | .parsing_errors' "$REPORT_JSON")
          {
            echo "### ${{ inputs.environment }} (checkov)"
            echo "Passed: ${passed}, Failed: ${failed}, Skipped: ${skipped}, Parsing errors: ${parsing_errors}"
            if [ "$failed" -gt 0 ] || [ "$parsing_errors" -gt 0 ]; then
              echo '<details><summary>Findings</summary>'
              echo
              echo '```'
              cat "$REPORT_TXT"
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "failed=${failed}"
            echo "parsing_errors=${parsing_errors}"
          } >> "$GITHUB_OUTPUT"

      # Uploaded unarchived, like the plan, so the reports open in the browser
      # from the run page instead of downloading as a zip. With archive: false
      # the file name is the artifact name, so each must be a single file.
      - name: Upload Checkov text report
        if: inputs.checkov
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: /tmp/${{ inputs.environment }}.checkov.txt
          archive: false

      - name: Upload Checkov JSON report
        if: inputs.checkov
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: /tmp/${{ inputs.environment }}.checkov.json
          archive: false

      - name: Kosli create flow
        if: inputs.kosli_template_file != ''
        run: kosli create flow "$KOSLI_FLOW" --template-file "${{ inputs.kosli_template_file }}"

      - name: Kosli begin trail
        if: inputs.kosli_template_file != ''
        run: |
          # shellcheck disable=SC2086
          kosli begin trail "$KOSLI_TRAIL" --template-file "${{ inputs.kosli_template_file }}" $COMMIT_ARG

      - name: Kosli attest plan
        if: inputs.kosli_template_file != ''
        run: |
          # shellcheck disable=SC2086
          kosli attest generic --name terraform-plan --attachments /tmp/${{ inputs.environment }}.plan.txt $COMMIT_ARG

      # The checkov custom attestation type (managed in terraform-kosli-app)
      # evaluates the report, so the trail is non-compliant on any finding
      # even when checkov_soft_fail keeps the job green.
      - name: Kosli attest checkov
        if: inputs.checkov && inputs.kosli_template_file != ''
        env:
          REPORT_TXT: /tmp/${{ inputs.environment }}.checkov.txt
          REPORT_JSON: /tmp/${{ inputs.environment }}.checkov.json
        run: |
          # shellcheck disable=SC2086
          kosli attest custom \
            --type checkov \
            --name checkov \
            --attestation-data "$REPORT_JSON" \
            --attachments "$REPORT_TXT" \
            $COMMIT_ARG

      # Runs after the attestation so the report always reaches Kosli, and
      # before the apply so a blocking finding stops the apply.
      - name: Checkov gate
        if: inputs.checkov
        env:
          SOFT_FAIL: ${{ inputs.checkov_soft_fail }}
          FAILED: ${{ steps.checkov-summary.outputs.failed }}
          PARSING_ERRORS: ${{ steps.checkov-summary.outputs.parsing_errors }}
        run: |
          if [ "$FAILED" -eq 0 ] && [ "$PARSING_ERRORS" -eq 0 ]; then
            exit 0
          fi
          message="Checkov: ${FAILED} failed check(s) and ${PARSING_ERRORS} parsing error(s) in ${{ inputs.environment }}"
          if [ "$SOFT_FAIL" = "true" ]; then
            echo "::warning::${message}; not failing the job because checkov_soft_fail is true"
            exit 0
          fi
          echo "::error::${message}"
          exit 1

      - name: Apply
        shell: bash
        if: inputs.tf_apply
        working-directory: ${{ inputs.working_directory }}
        run: tf apply -no-color 2>&1 | tee /tmp/${{ inputs.environment }}.apply.txt

      - name: Apply summary
        if: inputs.tf_apply
        run: |
          line=$(grep -E 'Apply complete!' /tmp/${{ inputs.environment }}.apply.txt)
          {
            echo "### ${{ inputs.environment }} (apply)"
            echo "$line"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload apply log
        if: inputs.tf_apply
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tfapply-${{ inputs.environment }}
          path: /tmp/${{ inputs.environment }}.apply.txt
          archive: false

      - name: Kosli attest apply
        if: inputs.tf_apply && inputs.kosli_template_file != ''
        run: |
          # shellcheck disable=SC2086
          kosli attest generic --name terraform-apply --attachments /tmp/${{ inputs.environment }}.apply.txt $COMMIT_ARG
