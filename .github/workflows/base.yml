name: Terraform

on:
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string
      aws_role_arn:
        required: true
        type: string
      aws_role_duration:
        default: "1200"
        type: string
      working_directory:
        default: "./"
        type: string
      tf_version:
        default: "1.14.6"
        type: string
      tf_apply:
        default: false
        type: boolean
      job_timeout_minutes:
        description: "Minutes before GitHub cancels the plan/apply job. The default follows aws_role_duration: the OIDC credentials are static environment variables that are never refreshed, so AWS calls start failing with ExpiredToken 1200s (20 min) after the credentials step and a longer ceiling would buy nothing. Raise both together if a legitimate apply needs longer."
        default: 30
        type: number
      environment:
        required: true
        type: string
      ref:
        default: ""
        type: string
      github_repository_to_checkout:
        description: "GitHub repository (owner/name) to check out. Defaults to the repository that initiated the run. Override when a workflow in one repository needs to operate on a different repository's Terraform code."
        default: ${{ github.repository }}
        type: string
      tf_vars:
        description: "Extra environment variables, one KEY=VALUE per line, exported before plan/apply. To set Terraform variable `foo`, use `TF_VAR_foo=...`. Single-line values only."
        default: ""
        type: string
      component_name:
        description: "Name of the thing being deployed, used for the statefile path terraform/<name>/. Empty uses the checked-out repository's name. Set it when one repository deploys several components, each with its own state."
        default: ""
        type: string
      kosli_template_file:
        description: "Path (in caller repo) to the Kosli trail template. Empty disables all Kosli steps."
        default: ""
        type: string
      kosli_host:
        default: "https://app.kosli.com"
        type: string
      kosli_org:
        default: "kosli"
        type: string
      kosli_flow:
        description: "Kosli flow name. Required when kosli_template_file is set."
        default: ""
        type: string
      kosli_cli_version:
        default: "latest"
        type: string
      pass_commit_to_kosli_commands:
        description: "When true, pass `--commit <ref>` to the Kosli commands via the COMMIT_ARG environment variable."
        default: false
        type: boolean
    secrets:
      kosli_api_token:
        description: "Kosli API token. Required when kosli_template_file is set."
        required: false
    outputs:
      has_changes:
        description: "true if the plan contains changes, false if no changes"
        value: ${{ jobs.terraform.outputs.has_changes }}
      kosli_flow:
        description: "The Kosli flow name used for attestations."
        value: ${{ jobs.terraform.outputs.kosli_flow }}
      kosli_trail:
        description: "The Kosli trail name used for attestations."
        value: ${{ jobs.terraform.outputs.kosli_trail }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    env:
      AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
      environment: ${{ inputs.environment }}
      KOSLI_ORG: ${{ inputs.kosli_org }}
      KOSLI_HOST: ${{ inputs.kosli_host }}
      KOSLI_API_TOKEN: ${{ secrets.kosli_api_token }}
      KOSLI_FLOW: ${{ inputs.kosli_flow }}
      KOSLI_TRAIL: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      COMMIT_ARG: ${{ inputs.pass_commit_to_kosli_commands && format('--commit {0}', inputs.ref) || '' }}
    permissions:
      id-token: write
      contents: write
    outputs:
      has_changes: ${{ steps.plan-summary.outputs.has_changes }}
      kosli_flow: ${{ steps.kosli-outputs.outputs.kosli_flow }}
      kosli_trail: ${{ steps.kosli-outputs.outputs.kosli_trail }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.github_repository_to_checkout }}
          ref: ${{ inputs.ref }}

      - name: Export Kosli outputs
        id: kosli-outputs
        run: |
          {
            echo "kosli_flow=$KOSLI_FLOW"
            echo "kosli_trail=$KOSLI_TRAIL"
          } >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ inputs.tf_version }}
          terraform_wrapper: false

      - name: Install tf
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kosli-dev/tf
          path: .tf-cli
      - run: echo "$GITHUB_WORKSPACE/.tf-cli/bin" >> "$GITHUB_PATH"

      - name: Install uv
        # Callers that package a python Lambda build it with `uv export` and
        # `uv pip install`, run by terraform-aws-modules/lambda/aws during apply.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Check formatting
        working-directory: ${{ inputs.working_directory }}
        run: terraform fmt --recursive -check

      - name: Configure AWS credentials
        timeout-minutes: 2
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-duration-seconds: ${{ inputs.aws_role_duration }}
          role-session-name: ${{ github.event.repository.name }}
          action-timeout-s: 45
          retry-max-attempts: 3

      - name: Setup Kosli CLI
        if: inputs.kosli_template_file != ''
        uses: kosli-dev/setup-cli-action@060e7f9bf6ac246743d6a62c5df847dfe7050867 # v5.2.1
        with:
          version: ${{ inputs.kosli_cli_version }}

      # Exported only when set, so an unset input leaves TF_COMPONENT_NAME
      # free to come from the repo's tf.env, as it does when tf runs locally.
      - name: Export component name
        if: inputs.component_name != ''
        env:
          COMPONENT_NAME: ${{ inputs.component_name }}
        run: printf 'TF_COMPONENT_NAME=%s\n' "$COMPONENT_NAME" >> "$GITHUB_ENV"

      - name: Export Terraform variables
        if: inputs.tf_vars != ''
        env:
          TF_VARS: ${{ inputs.tf_vars }}
        run: printf '%s\n' "$TF_VARS" >> "$GITHUB_ENV"

      - name: Plan
        working-directory: ${{ inputs.working_directory }}
        run: tf plan -no-color

      - name: Show plan
        working-directory: ${{ inputs.working_directory }}
        run: tf show -no-color /tmp/${{ inputs.environment }}.tfplan > /tmp/${{ inputs.environment }}.plan.txt

      - name: Plan summary
        id: plan-summary
        run: |
          # A plan that changes only outputs has neither a "Plan:" line nor
          # "No changes.", so fall back to the outputs header and then to a
          # generic message rather than letting grep fail the step.
          plan=/tmp/${{ inputs.environment }}.plan.txt
          line=$(grep -E 'No changes\.|Plan: ' "$plan" || true)
          if [ -z "$line" ]; then
            line=$(grep -E 'Changes to Outputs:' "$plan" || true)
          fi
          if [ -z "$line" ]; then
            line="See the uploaded plan for details."
          fi
          {
            echo "### ${{ inputs.environment }}"
            echo "$line"
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'No changes\.' "$plan"; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload plan
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tfplan-${{ inputs.environment }}
          path: /tmp/${{ inputs.environment }}.plan.txt
          archive: false

      - name: Kosli create flow
        if: inputs.kosli_template_file != ''
        run: kosli create flow "$KOSLI_FLOW" --template-file "${{ inputs.kosli_template_file }}"

      - name: Kosli begin trail
        if: inputs.kosli_template_file != ''
        run: |
          # shellcheck disable=SC2086
          kosli begin trail "$KOSLI_TRAIL" --template-file "${{ inputs.kosli_template_file }}" $COMMIT_ARG

      - name: Kosli attest plan
        if: inputs.kosli_template_file != ''
        run: |
          # shellcheck disable=SC2086
          kosli attest generic --name terraform-plan --attachments /tmp/${{ inputs.environment }}.plan.txt $COMMIT_ARG

      # terraform apply writes the state file even when it fails part-way, and
      # reset-drift-detection in apply.yml only attests it after a successful
      # apply. Recording the state file's ETag here lets the step after Apply
      # tell whether a failed apply rewrote it. The bucket and key are read from
      # the backend config that `tf plan` initialised, so they are exactly the
      # ones terraform uses. continue-on-error keeps this step from ever
      # blocking the apply; if it fails, a failed apply's state is not attested.
      - name: Record state file ETag before apply
        id: state-before
        if: inputs.tf_apply && inputs.kosli_template_file != ''
        continue-on-error: true
        working-directory: ${{ inputs.working_directory }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BACKEND=".terraform.${ACCOUNT_ID}-${AWS_DEFAULT_REGION}/terraform.tfstate"
          BUCKET=$(jq -r '.backend.config.bucket' "$BACKEND")
          KEY=$(jq -r '.backend.config.key' "$BACKEND")
          ETAG=$(aws s3api head-object --bucket "$BUCKET" --key "$KEY" --query ETag --output text)
          {
            echo "bucket=${BUCKET}"
            echo "key=${KEY}"
            echo "etag=${ETAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Apply
        id: apply
        shell: bash
        if: inputs.tf_apply
        working-directory: ${{ inputs.working_directory }}
        run: tf apply -no-color 2>&1 | tee /tmp/${{ inputs.environment }}.apply.txt

      # Attests the state file only when this failed apply changed it. A state
      # file the apply did not change may have been written outside CI, so it is
      # left unattested for drift detection to report. The object is downloaded
      # with --if-match on the ETag just read, so a write between the two reads
      # cannot be attested in its place. A write in the seconds between the
      # apply releasing its lock and the first read would be attested; that is
      # the same race reset-drift-detection has after a successful apply.
      - name: Kosli attest state file written by failed apply
        if: failure() && steps.apply.outcome == 'failure' && steps.state-before.outcome == 'success'
        env:
          BUCKET: ${{ steps.state-before.outputs.bucket }}
          KEY: ${{ steps.state-before.outputs.key }}
          ETAG_BEFORE: ${{ steps.state-before.outputs.etag }}
        run: |
          ETAG_AFTER=$(aws s3api head-object --bucket "$BUCKET" --key "$KEY" --query ETag --output text)
          if [ "$ETAG_AFTER" = "$ETAG_BEFORE" ]; then
            echo "The failed apply did not change the state file, so it is not attested."
            exit 0
          fi
          STATE_FILE="/tmp/$(basename "$KEY")"
          aws s3api get-object --bucket "$BUCKET" --key "$KEY" --if-match "$ETAG_AFTER" "$STATE_FILE" > /dev/null
          # shellcheck disable=SC2086
          kosli attest artifact "$STATE_FILE" --artifact-type file --name terraform-state $COMMIT_ARG

      - name: Apply summary
        if: inputs.tf_apply
        run: |
          line=$(grep -E 'Apply complete!' /tmp/${{ inputs.environment }}.apply.txt)
          {
            echo "### ${{ inputs.environment }} (apply)"
            echo "$line"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload apply log
        if: inputs.tf_apply
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tfapply-${{ inputs.environment }}
          path: /tmp/${{ inputs.environment }}.apply.txt
          archive: false

      - name: Kosli attest apply
        if: inputs.tf_apply && inputs.kosli_template_file != ''
        run: |
          # shellcheck disable=SC2086
          kosli attest generic --name terraform-apply --attachments /tmp/${{ inputs.environment }}.apply.txt $COMMIT_ARG
